name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run eval:deterministic
      - run: npm run build
      - run: npm run package:verify
      - run: node dist/bin/ovogogogo.js --version

  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}

  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/acp.test.ts tests/bashTool.test.ts tests/backgroundTaskManager.test.ts tests/quickStartScripts.test.ts tests/releaseArtifacts.test.ts
      - run: npm run package:verify
      - run: node dist/bin/ovogogogo.js --version
