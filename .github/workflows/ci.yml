name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: bash scripts/docDriftCheck.sh
      - run: bash scripts/deadCodeCheck.sh
      - run: node scripts/verify-shard.mjs 1 2
      - run: node scripts/verify-shard.mjs 2 2
      - run: pnpm eval:deterministic
      - run: pnpm build
      - run: pnpm package:verify
      - run: node dist/bin/ovogogogo.js --version

  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --shard=${{ matrix.shard }} --maxWorkers=1 --exclude tests/bashTool.test.ts --exclude tests/backgroundTaskManager.test.ts

  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run tests/acp.test.ts tests/bashTool.test.ts tests/backgroundTaskManager.test.ts tests/quickStartScripts.test.ts tests/releaseArtifacts.test.ts
      - run: pnpm package:verify
      - run: node dist/bin/ovogogogo.js --version
