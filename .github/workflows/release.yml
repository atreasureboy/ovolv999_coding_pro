name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build package artifact
        run: |
          npm pack --ignore-scripts
          sha256sum ovolv999-*.tgz > SHA256SUMS
      - name: Smoke test package artifact
        run: |
          mkdir package-smoke
          npm install --prefix package-smoke ./ovolv999-*.tgz
          package-smoke/node_modules/.bin/ovolv999 --version
      - name: Publish npm package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" ovolv999-*.tgz SHA256SUMS --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
