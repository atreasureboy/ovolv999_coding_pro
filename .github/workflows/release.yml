name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build package artifact
        run: |
          pnpm package:verify
          pnpm --config.ignore-scripts=true pack
          sha256sum ovolv999-*.tgz > SHA256SUMS
      - name: Smoke test package artifact
        run: |
          mkdir package-smoke
          pnpm add --dir package-smoke ./ovolv999-*.tgz
          package-smoke/node_modules/.bin/ovolv999 --version
      - name: Publish npm package
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" ovolv999-*.tgz SHA256SUMS --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
